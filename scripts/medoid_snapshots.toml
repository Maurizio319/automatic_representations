# Configuration of medoid_snapshots.py. Relative paths are relative to this file.
#   --dry-run | --preview [--all-medoids] | --menu | --pick TILE | (full run)

[inputs]
topology = "/scratch/mgilioli/PHD_Maurizio_BussiLab/simulations_and_analysis/19-metainference_complete_loops/traj_files/conf_mysel_synced.pdb"
trajectory = "/scratch/mgilioli/PHD_Maurizio_BussiLab/simulations_and_analysis/19-metainference_complete_loops/traj_files/traj-all-PBC-align.xtc"
interaction_file = ""

[output]
outdir = ""
frame_digits = 5              # zero padding of frame numbers in folder/file names

[filter]
threshold = 0.1               # medoid mode: keep contacts present in [threshold, 1 - threshold] of the frames

[grouping]
group_distance = 10.0         # Angstrom; smaller -> more, smaller groups
starting_frame = true         # true: group on frame 0; false: on positions averaged over the trajectory

[clustering]
min_cluster_size = 2          # medoid mode: HDBSCAN min_cluster_size

[reference]
# Reference mode: show the frames whose contacts differ from a reference structure.
interaction_file = ""         # contact file of the reference (one frame), e.g. <scan>_pdb/contacts.csv; "" = medoid mode
jaccard_cutoff = 0.3          # a frame differs if Jaccard(frame, reference) > cutoff, per group
min_frequency = 0.05          # ignore trajectory contacts present in fewer frames (reference contacts are always kept)

[run]
groups = []                   # group ids to process; empty = all groups
overwrite = false             # false: skip images already on disk (resume)
progress_every = 10           # print a progress line every N rendered images
min_prevalence = 0.0          # render only clusters/patterns with at least this fraction of the frames

[rotation]
# x in [x_start, x_stop), y in [y_start, y_stop): 180 x 360 deg covers every direction once
step = 45
x_start = 0
x_stop = 180
y_start = 0
y_stop = 360

[image]
width = 640
height = 480
format = "png"                # "png" or "jpg"
jpg_quality = 85              # only for format = "jpg"
ray = true                    # ray-trace (needed for headless rendering)

[menu]
outdir_name = "menu"          # subfolder of output.outdir
tiles_per_page = 4            # with step 45: 32 angles -> 8 pages per medoid (2 per x angle)
columns = 2                   # tiles per row of a page
tile_width = 640              # same as [image]: a tile looks like its picked image
tile_height = 480
tile_label_size = 20          # font size of the angle name on each tile

[preview]
outdir_name = "preview"       # subfolder of output.outdir
xang = 0
yang = 0

# Styling: edit, run --preview, look, repeat.
[style]
background = "white"
context_representations = ["cartoon"]   # whole system; e.g. ["cartoon"], ["cartoon", "surface"], [] for none
cartoon_transparency = 0.5
cartoon_color_protein = "grey80"
cartoon_color_nucleic = "lightorange"

group_representation = "sticks"         # group residues: "sticks", "lines", "spheres", ...
hide_hydrogens = true
stick_radius = 0.2
ligand_carbon_color = "orange"          # "ligand" residues of the group
protein_carbon_color = "skyblue"        # protein residues of the group

label_anchor_atoms = ["CA", "C1'", "P"] # first atom found in each residue carries its label
label_size = 8                          # pixels
label_color = "black"
label_outline_color = "default"         # a color for an outline around the text, "default" for none
label_font_id = 5                       # 5 = sans regular, 7 = sans bold
label_offset = [0.8, 0.8, 1.0]          # Angstrom: right, up, toward the camera
float_labels = true                     # labels always on top
label_bg_color = "default"              # box behind each label: a color, or "default" for no box
label_bg_transparency = 0.25
label_bg_outline = false                # thin frame around the box

show_inactive_contacts = false          # medoid mode: also dash pairs not in contact in the frame
polar_contact_color = "green"           # medoid mode: PyMOL polar contacts
closest_contact_color = "magenta"       # medoid mode: closest heavy atoms (no polar partner)
kept_contact_color = "grey50"           # reference mode: in the frame and the reference
gained_contact_color = "green"          # reference mode: in the frame only
lost_contact_color = "red"              # reference mode: in the reference only
dash_radius = 0.06                      # Angstrom; keep dash_gap < stick_radius so dashes touch both residues
dash_gap = 0.12
dash_length = 0.25

base_orientation = "orient"             # "orient": group's principal axes; "reset": PyMOL default frame
zoom_buffer = 5.0                       # Angstrom of margin around the group residues

extra_pml = ""                          # optional .pml file of PyMOL commands, applied last
# PyMOL commands run after extra_pml on every image. Object "sys", selection
# "group_res"; settings set on "sys" must be changed on "sys" ("set stick_radius, 0.25, sys").
extra_commands = """
# set cartoon_transparency, 0.7, sys
# color red, resn ARG and elem C
# set stick_radius, 0.25, sys
"""

[style.pymol_settings]                  # any other PyMOL setting
ray_trace_mode = 0
ray_shadows = 0
antialias = 1
ray_opaque_background = 1
depth_cue = 1
orthoscopic = 0
